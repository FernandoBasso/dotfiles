
##
# Easily chose a font with this command:
#
#   kitty +kitten choose_fonts
##
font_family      family='Hurmit Nerd Font Mono' postscript_name=HurmitNFM-Regular
bold_font        auto
italic_font      family='Hurmit Nerd Font Mono' style=Regular
bold_italic_font family='Hurmit Nerd Font Mono' style=Regular

font_size        14

adjust_column_width 110%
adjust_line_height  110%

##
# Because macOS default shell is zsh and I prefer not to mess
# with work laptop default shell.
#
shell bash --login
